server {
  listen 80;
  server_name _;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  # LLDP discovery captures for up to 60 seconds; allow SSH setup and result
  # persistence time in addition to the capture window.
  location /api/ { proxy_pass http://backend:8000/; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; proxy_connect_timeout 15s; proxy_send_timeout 180s; proxy_read_timeout 180s; }
  location /health { proxy_pass http://backend:8000/health; }
  # Standalone SPA entry point for the Compute Discovery module.
  location = /compute-discovery { proxy_pass http://frontend:8080/; proxy_set_header Host $host; }
  location /compute-discovery/ { proxy_pass http://frontend:8080/; proxy_set_header Host $host; }
  location / { proxy_pass http://frontend:8080/; proxy_set_header Host $host; }
}
